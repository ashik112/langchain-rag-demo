services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./assets:/app/assets
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Restart policy - always restart unless explicitly stopped
    restart: unless-stopped
    # Resource limits optimized for GCE e2-micro (1 vCPU, 1GB RAM)
    deploy:
      resources:
        limits:
          cpus: '0.8'          # Leave some CPU for system processes
          memory: 800M         # Leave ~200MB for system processes
        reservations:
          cpus: '0.2'
          memory: 200M
    # Use Gunicorn via Dockerfile CMD (production-ready)