services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=${ENV:-production}
      - PORT=${PORT:-5000}
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./assets:/app/assets
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Resource limits (adjust via environment variables)
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1.0}'
          memory: '${MEMORY_LIMIT:-1G}'
        reservations:
          cpus: '${CPU_RESERVATION:-0.25}'
          memory: '${MEMORY_RESERVATION:-256M}'