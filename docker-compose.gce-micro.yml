services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "80:5000"  # GCE instances typically serve on port 80
    env_file:
      - .env
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./assets:/app/assets
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - GUNICORN_CONFIG=gunicorn.gce-micro.conf.py
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 60s      # Less frequent checks to save resources
      timeout: 15s       # Longer timeout for slower processing
      retries: 3
      start_period: 60s  # Longer startup time for e2-micro
    # Restart policy - always restart unless explicitly stopped
    restart: unless-stopped
    # Resource limits optimized for GCE e2-micro (1 vCPU, 1GB RAM)
    deploy:
      resources:
        limits:
          cpus: '0.8'          # Leave some CPU for system processes
          memory: 800M         # Leave ~200MB for system processes
        reservations:
          cpus: '0.2'
          memory: 200M
    # Override CMD to use e2-micro specific configuration
    command: ["gunicorn", "--config", "gunicorn.gce-micro.conf.py", "wsgi:app"]
    
    # Logging configuration for GCE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 